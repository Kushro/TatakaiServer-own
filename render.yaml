services:
  - type: web
    name: tatakai-extension-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /api/server/v1/health
    envVars:
      - key: SERVER_SECRET
        generateValue: true
      - key: BOOTSTRAP_SECRET
        generateValue: true
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_PERSISTENT_STORAGE
        value: "1"
